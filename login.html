<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GeoNav - Acesso ao Sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 w-full max-w-sm shadow-2xl flex flex-col gap-5">
    <div class="flex flex-col items-center text-center gap-2">
      <div class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-truck-moving"></i>
      </div>
      <h1 class="text-xl font-black text-white">GeoNav Studio</h1>
      <p class="text-xs text-slate-400">Entre com as suas credenciais de acesso</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Utilizador</label>
        <input id="userInput" type="text" required placeholder="Ex: admin ou motorista" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400 block mb-1">Palavra-passe</label>
        <input id="passInput" type="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button id="btnSubmit" type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white shadow-lg transition active:scale-95">
        Entrar
      </button>

      <div id="loginMsg" class="hidden text-center text-xs text-rose-400 font-semibold p-2 rounded-lg bg-rose-500/10 border border-rose-500/20"></div>
    </form>
    
    <div class="text-[11px] text-slate-400 border-t border-slate-800/80 pt-3 flex flex-col gap-1">
      <span class="font-bold text-slate-300">Contas pré-configuradas no banco:</span>
      <div class="flex justify-between">
        <span>Gestor (Editor):</span>
        <code class="text-indigo-300">admin / editor123</code>
      </div>
      <div class="flex justify-between">
        <span>Condutor (Navegador):</span>
        <code class="text-emerald-300">motorista / nav123</code>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://teste1-p5pw.onrender.com/api';

    async function handleLogin(e) {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      const btn = document.getElementById('btnSubmit');
      
      msg.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> A autenticar...';

      const username = document.getElementById('userInput').value.trim();
      const password = document.getElementById('passInput').value.trim();

      try {
        const res = await fetch(`${API_BASE_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.user) {
          localStorage.setItem('geonav_session', JSON.stringify(data.user));
          if (data.user.role === 'editor') {
            window.location.href = 'index.html';
          } else {
            window.location.href = 'index_gps.html';
          }
        } else {
          msg.innerText = data.erro || 'Utilizador ou palavra-passe incorretos.';
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.innerText = 'Falha ao contactar a API na nuvem. Aguarde alguns segundos e tente novamente.';
        msg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Entrar';
      }
    }
  </script>
</body>
</html>
