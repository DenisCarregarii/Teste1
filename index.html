<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GeoNav Studio - Editor & Monitoramento</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; user-select: none; }
    #map { height: 100%; width: 100%; z-index: 5; background: #020617; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* MENU LATERAL ESQUERDO */
    #mainSidebar { position: relative; display: flex; flex-direction: column; height: 100%; width: 68px; transition: width .3s ease; }
    #mainSidebar.expanded { width: 248px; }
    .sb-toggle {
      position: absolute; top: 20px; right: -12px; width: 24px; height: 24px; border-radius: 9999px;
      background: #1e293b; border: 1px solid #475569; color: #cbd5e1; font-size: 10px;
      display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .sb-toggle:hover { background: #4f46e5; color: #fff; }
    .sb-head { height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(30,41,59,.8); flex: none; overflow: hidden; }
    .sb-company { height: 40px; padding: 0 22px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(30,41,59,.6); flex: none; overflow: hidden; }
    .sb-nav { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden; }
    .sb-foot { padding: 8px; border-top: 1px solid #1e293b; flex: none; }
    .sidebar-text { opacity: 0; max-width: 0; overflow: hidden; white-space: nowrap; transition: opacity .2s ease, max-width .3s ease; }
    #mainSidebar.expanded .sidebar-text { opacity: 1; max-width: 190px; }

    .nav-btn { display: flex; align-items: center; gap: 14px; width: 100%; height: 42px; padding: 0 16px; border-radius: 12px; color: #94a3b8; font-size: 12px; font-weight: 600; transition: background .15s, color .15s; cursor: pointer; text-align: left; overflow: hidden; flex: none; }
    .nav-btn:hover { background: #1e293b; color: #fff; }
    .nav-ico { width: 20px; flex: none; text-align: center; font-size: 14px; }
    .nav-btn.on-indigo { background: #4f46e5; color: #fff; }
    .nav-btn.on-amber { background: #d97706; color: #fff; }
    .nav-btn.on-rose { background: #e11d48; color: #fff; }
    .nav-btn.group-on { color: #fff; background: rgba(79,70,229,.18); }
    .nav-btn.c-amber { color: #fbbf24; }
    .nav-btn.c-emerald { color: #34d399; }
    .nav-btn.c-indigo { color: #a5b4fc; }
    .nav-btn.c-sky { color: #38bdf8; }
    .nav-btn.c-rose { color: #fb7185; }
    .nav-sub { display: flex; flex-direction: column; gap: 4px; }
    #mainSidebar.expanded .nav-sub { margin-left: 18px; padding-left: 6px; border-left: 1px solid #334155; }
    .chev { margin-left: auto; font-size: 10px; transition: transform .2s; }
    .chev.closed { transform: rotate(-90deg); }

    /* PAINEL LATERAL DIREITO */
    #trackingSidebar {
      position: absolute; top: 0; right: 0; height: 100%; width: 330px;
      transform: translateX(100%); transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 45; display: flex; flex-direction: column;
    }
    #trackingSidebar.open { transform: translateX(0); }

    .truck-sonar-wave {
      position: absolute; width: 44px; height: 44px; border-radius: 9999px;
      background: rgba(16, 185, 129, 0.35);
      animation: truckSonar 2s cubic-bezier(0.2, 0, 0.4, 1) infinite;
    }
    @keyframes truckSonar {
      0% { transform: scale(0.6); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .custom-marker-pin { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; border-radius: 9999px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.45); }
    .mid-handle { width: 13px; height: 13px; border-radius: 9999px; background: rgba(255,255,255,.95); border: 2.5px solid #4f46e5; box-shadow: 0 2px 6px rgba(0,0,0,.4); cursor: pointer; }
    .vtx { width: 16px; height: 16px; border-radius: 9999px; background: #fff; border: 3px solid #f43f5e; box-shadow: 0 2px 6px rgba(0,0,0,.55); cursor: grab; }
    .vtx.first { width: 20px; height: 20px; background: #f43f5e; border-color: #fff; }
    .vtx-mid { width: 11px; height: 11px; border-radius: 9999px; background: rgba(255,255,255,.9); border: 2px solid #f43f5e; box-shadow: 0 1px 4px rgba(0,0,0,.5); cursor: pointer; opacity: .85; }
    .fence-chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; background: rgba(15,23,42,.92); color: #fda4af; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 9999px; border: 1.5px solid #f43f5e; box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer; }

    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 9999px; font-size: 9.5px; font-weight: 700; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .chip.emerald { background: rgba(16,185,129,.15); color: #6ee7b7; border-color: rgba(16,185,129,.4); }
    .dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; }
    .pop-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; color: #fff; cursor: pointer; }
    .tb-btn { padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid transparent; transition: .15s; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 h-full w-full overflow-hidden flex antialiased">

  <!-- MENU LATERAL -->
  <aside id="mainSidebar" class="bg-slate-900 border-r border-slate-800 z-40 shrink-0">
    <button class="sb-toggle" onclick="toggleSidebar()" title="Expandir / recolher menu">
      <i id="sidebarToggleIcon" class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="sb-head">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shrink-0 shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-truck-moving text-sm"></i>
      </div>
      <span class="sidebar-text font-black text-white text-sm tracking-tight">GeoNav Studio</span>
    </div>

    <div class="sb-company">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></div>
      <span id="companyBadge" class="sidebar-text text-[11px] font-bold text-slate-300 truncate">Empresa</span>
    </div>

    <nav class="sb-nav no-scrollbar">
      <div>
        <button id="navDrawBtn" onclick="toggleDrawGroup()" title="Desenho" class="nav-btn group-on">
          <i class="fa-solid fa-pen-ruler nav-ico"></i>
          <span class="sidebar-text">Desenho</span>
          <i id="drawChevron" class="fa-solid fa-chevron-down chev sidebar-text"></i>
        </button>
        <div id="drawSub" class="nav-sub mt-1">
          <button onclick="setAppMode('edit')" id="navEditBtn" title="Traçado da rota" class="nav-btn">
            <i class="fa-solid fa-bezier-curve nav-ico"></i>
            <span class="sidebar-text">Traçado da rota</span>
          </button>
          <button onclick="setAppMode('speed')" id="navSpeedBtn" title="Velocidade" class="nav-btn">
            <i class="fa-solid fa-gauge-high nav-ico"></i>
            <span class="sidebar-text">Velocidade</span>
          </button>
          <button onclick="setAppMode('fence')" id="navFenceBtn" title="Cerca virtual" class="nav-btn">
            <i class="fa-solid fa-draw-polygon nav-ico"></i>
            <span class="sidebar-text">Cerca virtual</span>
          </button>
        </div>
      </div>

      <button onclick="toggleTrackingSidebar()" id="btnNavTracking" title="Monitoramento em tempo real" class="nav-btn c-amber">
        <i class="fa-solid fa-tower-broadcast nav-ico animate-pulse"></i>
        <span class="sidebar-text">Monitoramento</span>
      </button>

      <button onclick="toggleRouteManagerModal()" title="Rotas guardadas" class="nav-btn c-emerald">
        <i class="fa-solid fa-database nav-ico"></i>
        <span class="sidebar-text">Rotas guardadas</span>
      </button>

      <button onclick="window.location.href='index_gps.html'" title="Abrir navegador GPS" class="nav-btn c-indigo">
        <i class="fa-solid fa-location-arrow nav-ico"></i>
        <span class="sidebar-text">Abrir navegador</span>
      </button>
    </nav>

    <div class="sb-foot">
      <button onclick="logout()" title="Terminar sessão" class="nav-btn c-rose">
        <i class="fa-solid fa-power-off nav-ico"></i>
        <span class="sidebar-text">Sair do sistema</span>
      </button>
    </div>
  </aside>

  <!-- MAPA PRINCIPAL -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- Controles flutuantes -->
    <div class="absolute right-3 top-4 flex flex-col gap-1.5 z-20">
      <button onclick="toggleTrackingSidebar()" title="Monitoramento" class="w-10 h-10 rounded-xl bg-slate-900/90 text-amber-400 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800 transition">
        <i class="fa-solid fa-tower-broadcast text-xs animate-pulse"></i>
      </button>
      <button onclick="map.zoomIn()" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-plus text-xs"></i></button>
      <button onclick="map.zoomOut()" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-minus text-xs"></i></button>
      <button onclick="fitRouteBounds()" title="Enquadrar rota" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-expand text-xs"></i></button>
      <button onclick="findMyCurrentLocation()" title="Minha posição" class="w-10 h-10 rounded-xl bg-slate-900/90 text-indigo-400 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-crosshairs text-xs"></i></button>
    </div>

    <!-- PAINEL INFERIOR DE DESENHO (OCULTO NO MODO MONITORAMENTO) -->
    <div id="editToolbar" class="absolute bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[760px] bg-slate-900/95 backdrop-blur-md rounded-2xl border border-slate-800 shadow-2xl p-3 z-20 flex flex-col sm:flex-row items-center justify-between gap-2.5">
      <div class="flex items-center gap-3 text-xs">
        <span id="routePointsCount" class="font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">0 pontos</span>
        <span class="text-slate-600">|</span>
        <span id="routeTotalDistance" class="font-bold text-white">0 m</span>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="undoLastWaypoint()" class="tb-btn bg-slate-800 text-slate-300 hover:bg-slate-700 border-slate-700">
          <i class="fa-solid fa-rotate-left"></i><span>Desfazer</span>
        </button>
        <button onclick="clearCurrentRoute()" class="tb-btn bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 border-rose-500/30">
          <i class="fa-solid fa-trash-can"></i><span>Limpar</span>
        </button>
        <button onclick="openSaveModal()" class="tb-btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-600/30 active:scale-95">
          <i class="fa-solid fa-cloud-arrow-up text-sm"></i><span>Guardar Rota</span>
        </button>
      </div>
    </div>
  </main>

  <!-- 📡 BARRA LATERAL DIREITA: MONITORAMENTO DE EQUIPAMENTOS -->
  <aside id="trackingSidebar" class="bg-slate-900/95 backdrop-blur-md border-l border-slate-800 shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-sm shadow">
          <i class="fa-solid fa-tower-broadcast animate-pulse"></i>
        </div>
        <div>
          <h2 class="text-sm font-black text-white tracking-tight">Monitoramento</h2>
          <p class="text-[10px] text-slate-400 font-semibold" id="trackingCompanyLabel">Equipamentos</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="fitEquipmentBounds()" title="Centralizar todos os equipamentos" class="w-8 h-8 rounded-xl bg-slate-800 text-amber-400 hover:text-white flex items-center justify-center transition hover:bg-slate-700">
          <i class="fa-solid fa-expand text-xs"></i>
        </button>
        <button onclick="toggleTrackingSidebar()" class="w-8 h-8 rounded-xl bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition hover:bg-slate-700">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Indicadores -->
    <div class="grid grid-cols-2 gap-2 p-3 border-b border-slate-800/80 bg-slate-950/40">
      <div class="bg-slate-800/70 border border-emerald-500/30 rounded-xl p-2.5 flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
        <div>
          <div class="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Online</div>
          <div class="text-lg font-black text-white" id="onlineCountBadge">0</div>
        </div>
      </div>
      <div class="bg-slate-800/70 border border-slate-700/60 rounded-xl p-2.5 flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-slate-500"></span>
        <div>
          <div class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Offline</div>
          <div class="text-lg font-black text-white" id="offlineCountBadge">0</div>
        </div>
      </div>
    </div>

    <div id="connectedUsersContainer" class="flex-1 overflow-y-auto p-3 space-y-2 no-scrollbar">
      <p class="text-slate-400 text-center py-8 text-xs font-medium">A buscar sinal dos equipamentos...</p>
    </div>
  </aside>

  <!-- MODAL GUARDAR ROTA -->
  <div id="saveModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 flex flex-col gap-3 shadow-2xl">
      <h3 class="font-bold text-sm text-white">Guardar rota na empresa</h3>
      <input id="routeNameInput" type="text" placeholder="Nome da rota" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none">
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeSaveModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">Cancelar</button>
        <button onclick="confirmSaveRoute()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ROTAS GUARDADAS -->
  <div id="routeManagerModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg flex flex-col max-h-[80vh] overflow-hidden shadow-2xl">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-sm text-white">Rotas Guardadas</h3>
        <button onclick="toggleRouteManagerModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>
      <div id="savedRoutesContainer" class="p-3.5 overflow-y-auto space-y-2 text-xs no-scrollbar"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://teste1-p5pw.onrender.com/api';
    const $ = id => document.getElementById(id);

    let sessionUser = null;
    try { sessionUser = JSON.parse(localStorage.getItem('geonav_session') || 'null'); } catch(e){}
    if (!sessionUser || sessionUser.role !== 'editor') {
      window.location.href = 'login.html';
    } else {
      $('companyBadge').innerText = sessionUser.company_name || 'Organização';
      $('trackingCompanyLabel').innerText = `Frota ativa: ${sessionUser.company_name || 'Organização'}`;
    }

    function logout() {
      localStorage.removeItem('geonav_session');
      window.location.href = 'login.html';
    }

    let map = null, markersLayer, routeSegmentsLayer, midHandlesLayer, trackingLayer;
    let waypoints = [], appMode = 'edit', totalRouteDistanceMeters = 0;
    let isTrackingSidebarOpen = false, currentActiveTrucks = [], hasAutoCenteredTracking = false;

    window.addEventListener('load', () => {
      initMap();
      fetchRoutesFromDatabase();
      fetchActiveUsers();
      setInterval(fetchActiveUsers, 3000);
    });

    function initMap() {
      try {
        map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-23.5505, -46.6333], 14);
        
        // Camada estável OpenStreetMap / Carto
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19
        }).addTo(map);

        routeSegmentsLayer = L.layerGroup().addTo(map);
        midHandlesLayer = L.layerGroup().addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        trackingLayer = L.layerGroup().addTo(map);

        map.on('click', onMapClick);
      } catch (err) {
        console.error("Erro mapa:", err);
      }
    }

    function toggleSidebar() {
      $('mainSidebar').classList.toggle('expanded');
    }
    function toggleDrawGroup() {
      $('drawSub').classList.toggle('hidden');
    }

    function setAppMode(mode) {
      appMode = mode;
      const isDrawing = (mode === 'edit' || mode === 'speed');
      const isTracking = (mode === 'tracking');

      $('editToolbar').classList.toggle('hidden', !isDrawing);
      $('trackingSidebar').classList.toggle('open', isTracking);
      isTrackingSidebarOpen = isTracking;

      if (isTracking) fetchActiveUsers();
    }

    function toggleTrackingSidebar() {
      if (appMode === 'tracking') {
        setAppMode('edit');
      } else {
        hasAutoCenteredTracking = false;
        setAppMode('tracking');
      }
    }

    function onMapClick(e) {
      if (appMode === 'edit') {
        waypoints.push({ lat: e.latlng.lat, lng: e.latlng.lng, speedLimit: 60, roadType: 'paved' });
        refreshRouteVisuals();
      }
    }

    function refreshRouteVisuals() {
      markersLayer.clearLayers();
      routeSegmentsLayer.clearLayers();
      midHandlesLayer.clearLayers();

      let totalM = 0;
      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i], p2 = waypoints[i + 1];
        totalM += distanceInMeters(p1.lat, p1.lng, p2.lat, p2.lng);
        L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], { color: '#4f46e5', weight: 6 }).addTo(routeSegmentsLayer);

        const mid = [(p1.lat + p2.lat)/2, (p1.lng + p2.lng)/2];
        L.marker(mid, { icon: L.divIcon({ html: '<div class="mid-handle"></div>', iconSize: [13, 13], iconAnchor: [6, 6] }) })
          .on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            waypoints.splice(i + 1, 0, { lat: mid[0], lng: mid[1], speedLimit: 60, roadType: 'paved' });
            refreshRouteVisuals();
          }).addTo(midHandlesLayer);
      }

      totalRouteDistanceMeters = totalM;
      $('routePointsCount').innerText = `${waypoints.length} pontos`;
      $('routeTotalDistance').innerText = totalM >= 1000 ? `${(totalM / 1000).toFixed(2)} km` : `${Math.round(totalM)} m`;

      waypoints.forEach((pt, i) => {
        const isStart = i === 0, isEnd = i === waypoints.length - 1 && waypoints.length > 1;
        const bg = isStart ? 'bg-emerald-500' : (isEnd ? 'bg-rose-500' : 'bg-indigo-600');
        const icon = L.divIcon({ html: `<div class="custom-marker-pin ${bg}" style="width:26px;height:26px;font-size:11px;">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
        
        L.marker([pt.lat, pt.lng], { icon, draggable: true })
          .on('dragend', ev => {
            pt.lat = ev.target.getLatLng().lat;
            pt.lng = ev.target.getLatLng().lng;
            refreshRouteVisuals();
          })
          .on('contextmenu', () => {
            waypoints.splice(i, 1);
            refreshRouteVisuals();
          })
          .addTo(markersLayer);
      });
    }

    function distanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function undoLastWaypoint() { waypoints.pop(); refreshRouteVisuals(); }
    function clearCurrentRoute() { waypoints = []; refreshRouteVisuals(); }
    function fitRouteBounds() { if (waypoints.length) map.fitBounds(L.latLngBounds(waypoints.map(p => [p.lat, p.lng])), { padding: [60, 60] }); }
    function findMyCurrentLocation() { navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 16)); }

    function openSaveModal() { if (waypoints.length >= 2) $('saveModal').classList.remove('hidden'); }
    function closeSaveModal() { $('saveModal').classList.add('hidden'); }

    async function confirmSaveRoute() {
      const name = $('routeNameInput').value.trim() || 'Nova Rota';
      await fetch(`${API_BASE_URL}/routes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company_id: sessionUser.company_id, name, distance_meters: totalRouteDistanceMeters, waypoints })
      });
      closeSaveModal();
      clearCurrentRoute();
      fetchRoutesFromDatabase();
    }

    async function fetchRoutesFromDatabase() {
      try {
        const res = await fetch(`${API_BASE_URL}/routes?company_id=${sessionUser.company_id}`);
        const data = await res.json();
        const c = $('savedRoutesContainer');
        c.innerHTML = data.map(item => `
          <div class="bg-slate-800 p-3 rounded-xl flex items-center justify-between border border-slate-700">
            <div>
              <p class="font-bold text-white text-xs">${item.name}</p>
              <p class="text-[10px] text-slate-400">${(item.distance_meters / 1000).toFixed(2)} km</p>
            </div>
            <button onclick='loadRoute(${JSON.stringify(item.waypoints)})' class="px-2.5 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold">Carregar</button>
          </div>
        `).join('');
      } catch(e) {}
    }

    function loadRoute(pts) {
      waypoints = pts;
      refreshRouteVisuals();
      fitRouteBounds();
      toggleRouteManagerModal();
    }
    function toggleRouteManagerModal() { $('routeManagerModal').classList.toggle('hidden'); }

    // 📡 TELEMETRIA (FROTA EM DESTAQUE + VERDE / CINZA)
    function extractFleetNumber(u) {
      if (u.fleet) return String(u.fleet).trim();
      const m = String(u.name || '').match(/(\d{3,5})/);
      return m ? m[1] : (u.username || 'Frota');
    }

    async function fetchActiveUsers() {
      try {
        const res = await fetch(`${API_BASE_URL}/telemetry/active?company_id=${sessionUser.company_id}`);
        if (!res.ok) return;
        const users = await res.json();
        currentActiveTrucks = Array.isArray(users) ? users : [];

        renderTrackingMarkers();
        renderTrackingList();

        if (appMode === 'tracking' && !hasAutoCenteredTracking && currentActiveTrucks.length > 0) {
          fitEquipmentBounds(false);
          hasAutoCenteredTracking = true;
        }
      } catch(e) {}
    }

    function renderTrackingMarkers() {
      trackingLayer.clearLayers();

      currentActiveTrucks.forEach(u => {
        const isOnline = u.seconds_ago < 60;
        const fleetNum = extractFleetNumber(u);

        const markerHtml = `
          <div class="relative flex flex-col items-center select-none" style="transform: translate(-50%, -100%);">
            <div class="px-2.5 py-0.5 rounded-full ${isOnline ? 'bg-emerald-600 text-white border-white ring-2 ring-emerald-500/40' : 'bg-slate-700 text-slate-200 border-slate-400'} text-[11px] font-black shadow-2xl border-2 whitespace-nowrap mb-1">
              <span>${fleetNum}</span>
            </div>
            <div class="relative flex items-center justify-center">
              ${isOnline ? '<div class="truck-sonar-wave"></div>' : ''}
              <div class="w-8 h-8 rounded-full ${isOnline ? 'bg-emerald-500 border-white text-white' : 'bg-slate-600 border-slate-400 text-slate-300'} border-2 shadow-2xl flex items-center justify-center text-xs z-10">
                <i class="fa-solid fa-truck"></i>
              </div>
            </div>
          </div>
        `;

        L.marker([u.latitude, u.longitude], { icon: L.divIcon({ html: markerHtml, iconSize: [0, 0] }) })
          .bindPopup(`<b>Frota ${fleetNum}</b><br>Velocidade: ${u.speed_kmh} km/h<br>Sinal: há ${Math.round(u.seconds_ago)}s`)
          .addTo(trackingLayer);
      });
    }

    function renderTrackingList() {
      const c = $('connectedUsersContainer');
      let onCount = 0, offCount = 0;
      currentActiveTrucks.forEach(u => { if (u.seconds_ago < 60) onCount++; else offCount++; });
      $('onlineCountBadge').innerText = onCount;
      $('offlineCountBadge').innerText = offCount;

      if (!currentActiveTrucks.length) {
        c.innerHTML = '<p class="text-slate-500 text-center py-8 text-xs font-medium">Nenhum equipamento conectado.</p>';
        return;
      }

      c.innerHTML = currentActiveTrucks.map(u => {
        const isOnline = u.seconds_ago < 60;
        const fleetNum = extractFleetNumber(u);
        return `
          <div class="p-3 rounded-2xl bg-slate-800/80 border ${isOnline ? 'border-emerald-500/30' : 'border-slate-700/60'} flex items-center justify-between">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-black text-white text-xs">FROTA ${fleetNum}</span>
                <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-400 animate-ping' : 'bg-slate-500'}"></span>
              </div>
              <p class="text-[10px] text-slate-400 mt-0.5">${u.speed_kmh} km/h • há ${Math.round(u.seconds_ago)}s</p>
            </div>
            <button onclick="map.setView([${u.latitude}, ${u.longitude}], 17)" class="px-2.5 py-1.5 rounded-xl bg-indigo-600 text-white font-bold text-xs">Focar</button>
          </div>
        `;
      }).join('');
    }

    function fitEquipmentBounds(silent = false) {
      const pts = currentActiveTrucks.map(u => [u.latitude, u.longitude]);
      if (!pts.length) {
        if (!silent) alert('Nenhum equipamento conectado.');
        return;
      }
      if (pts.length === 1) map.setView(pts[0], 16);
      else map.fitBounds(L.latLngBounds(pts), { padding: [80, 80], maxZoom: 17 });
    }
  </script>
</body>
</html>
