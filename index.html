<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GeoNav Studio - Editor</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; user-select: none; }
    #map { height: 100%; width: 100%; z-index: 5; }
    .custom-marker-pin { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; border-radius: 9999px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.45); }
    .sidebar-expanded { width: 240px; }
    .sidebar-collapsed { width: 68px; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 h-full w-full overflow-hidden flex antialiased">

  <!-- 🍔 MENU LATERAL RETRÁTIL EXPANSÍVEL -->
  <aside id="mainSidebar" class="sidebar-collapsed transition-all duration-300 bg-slate-900 border-r border-slate-800 flex flex-col justify-between z-40 shrink-0">
    <div>
      <!-- Topo do Menu com Toggle -->
      <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800/80">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shrink-0 shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-truck-moving text-sm"></i>
          </div>
          <span class="sidebar-text hidden font-black text-white text-sm tracking-tight whitespace-nowrap">GeoNav Studio</span>
        </div>
        <button onclick="toggleSidebar()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i id="sidebarToggleIcon" class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <!-- Identificação da Empresa -->
      <div class="p-3 border-b border-slate-800/60 flex items-center gap-2 overflow-hidden">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></div>
        <span id="companyBadge" class="sidebar-text hidden text-[11px] font-bold text-slate-300 truncate">Empresa</span>
      </div>

      <!-- Ícones / Ferramentas -->
      <nav class="p-2 space-y-1.5">
        <button onclick="setAppMode('edit')" id="navEditBtn" title="Desenhar Rotas" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-xs transition">
          <i class="fa-solid fa-bezier-curve text-sm shrink-0"></i>
          <span class="sidebar-text hidden whitespace-nowrap">Desenhar Rotas</span>
        </button>

        <button onclick="setAppMode('fence')" id="navFenceBtn" title="Cercas Geográficas" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-semibold text-xs transition">
          <i class="fa-solid fa-draw-polygon text-sm shrink-0"></i>
          <span class="sidebar-text hidden whitespace-nowrap">Cercas Virtuais</span>
        </button>

        <button onclick="toggleTrackingModal()" title="Monitoramento em Tempo Real" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-amber-400 hover:bg-amber-500/10 font-semibold text-xs transition">
          <i class="fa-solid fa-tower-broadcast text-sm shrink-0 animate-pulse"></i>
          <span class="sidebar-text hidden whitespace-nowrap">Monitoramento</span>
        </button>

        <button onclick="toggleRouteManagerModal()" title="Rotas Guardadas" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-emerald-400 hover:bg-emerald-500/10 font-semibold text-xs transition">
          <i class="fa-solid fa-database text-sm shrink-0"></i>
          <span class="sidebar-text hidden whitespace-nowrap">Rotas Guardadas</span>
        </button>

        <button onclick="window.location.href='index_gps.html'" title="Mudar para Navegação GPS" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-indigo-300 hover:bg-indigo-500/10 font-semibold text-xs transition">
          <i class="fa-solid fa-location-arrow text-sm shrink-0"></i>
          <span class="sidebar-text hidden whitespace-nowrap">Abrir Navegador</span>
        </button>
      </nav>
    </div>

    <!-- Rodapé do Menu (Sair) -->
    <div class="p-2 border-t border-slate-800">
      <button onclick="logout()" title="Terminar Sessão" class="w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 text-xs font-semibold transition">
        <i class="fa-solid fa-power-off text-sm shrink-0"></i>
        <span class="sidebar-text hidden whitespace-nowrap">Sair do Sistema</span>
      </button>
    </div>
  </aside>

  <!-- ÁREA CENTRAL DO MAPA -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>

    <!-- Controles Flutuantes à Direita -->
    <div class="absolute right-3 top-4 flex flex-col gap-1.5 z-20">
      <button onclick="map.zoomIn()" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-plus text-xs"></i></button>
      <button onclick="map.zoomOut()" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-minus text-xs"></i></button>
      <button onclick="fitRouteBounds()" title="Enquadrar Rota" class="w-10 h-10 rounded-xl bg-slate-900/90 text-slate-200 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-expand text-xs"></i></button>
      <button onclick="findMyCurrentLocation()" title="Minha Posição" class="w-10 h-10 rounded-xl bg-slate-900/90 text-indigo-400 border border-slate-700/80 shadow flex items-center justify-center hover:bg-slate-800"><i class="fa-solid fa-crosshairs text-xs"></i></button>
    </div>

    <!-- PAINEL INFERIOR: MODO ROTAS -->
    <div id="editToolbar" class="absolute bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[620px] bg-slate-900/95 backdrop-blur-md rounded-2xl border border-slate-800 shadow-2xl p-3 z-20 flex items-center justify-between">
      <div class="flex items-center gap-3 text-xs">
        <span id="routePointsCount" class="font-bold text-emerald-400">0 pts</span>
        <span class="text-slate-600">|</span>
        <span id="routeTotalDistance" class="font-bold text-white">0.00 km</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="undoLastWaypoint()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700 border border-slate-700">Desfazer</button>
        <button onclick="clearCurrentRoute()" class="px-2.5 py-1.5 rounded-xl bg-rose-500/10 text-rose-300 text-xs hover:bg-rose-500/20 border border-rose-500/30">Limpar</button>
        <button onclick="openSaveModal()" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow flex items-center gap-1.5">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Guardar Rota</span>
        </button>
      </div>
    </div>

    <!-- PAINEL INFERIOR: MODO CERCAS -->
    <div id="fenceToolbar" class="hidden absolute bottom-4 left-3 right-3 md:left-1/2 md:-translate-x-1/2 md:w-[620px] bg-slate-900/95 backdrop-blur-md rounded-2xl border border-rose-500/40 shadow-2xl p-3 z-20 flex items-center justify-between">
      <div class="text-xs font-bold text-rose-300">
        Desenhar Cerca: <span id="fencePointsCount" class="text-white font-normal">0 vértices</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearCurrentFenceDraft()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Limpar</button>
        <button onclick="openSaveFenceModal()" class="px-3.5 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow flex items-center gap-1.5">
          <i class="fa-solid fa-check"></i>
          <span>Guardar Cerca</span>
        </button>
      </div>
    </div>
  </main>

  <!-- MODAL: MONITORIZAÇÃO EM TEMPO REAL -->
  <div id="trackingModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[80vh] overflow-hidden">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-tower-broadcast text-amber-400"></i>
          Veículos Ativos na Organização
        </h3>
        <button onclick="toggleTrackingModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="connectedUsersContainer" class="p-3.5 overflow-y-auto space-y-2 text-xs no-scrollbar"></div>
    </div>
  </div>

  <!-- MODAIS DE GRAVAÇÃO E ROTAS -->
  <div id="saveModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-4 flex flex-col gap-3">
      <h3 class="font-bold text-sm text-white">Guardar Rota na Empresa</h3>
      <input id="routeNameInput" type="text" placeholder="Nome da Rota" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeSaveModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Cancelar</button>
        <button onclick="confirmSaveRoute()" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <div id="saveFenceModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-rose-500/40 rounded-2xl w-full max-w-sm p-4 flex flex-col gap-3">
      <h3 class="font-bold text-sm text-white">Definir Restrição de Cerca</h3>
      <input id="fenceNameInput" type="text" placeholder="Identificação da Área" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-400">Velocidade Máx:</label>
        <input id="fenceSpeedInput" type="number" value="30" class="w-20 bg-slate-800 border border-rose-500/50 rounded-xl px-3 py-1.5 text-center text-rose-300 font-bold">
        <span class="text-xs text-slate-400">km/h</span>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
        <button onclick="closeSaveFenceModal()" class="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs">Cancelar</button>
        <button onclick="confirmSaveFence()" class="px-3.5 py-1.5 rounded-xl bg-rose-600 text-white font-bold text-xs">Guardar</button>
      </div>
    </div>
  </div>

  <div id="routeManagerModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md flex flex-col max-h-[80vh] overflow-hidden">
      <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-sm text-white">Rotas Guardadas</h3>
        <button onclick="toggleRouteManagerModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="savedRoutesContainer" class="p-3.5 overflow-y-auto space-y-2 text-xs no-scrollbar"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://teste1-p5pw.onrender.com/api';

    const sessionUser = JSON.parse(localStorage.getItem('geonav_session') || 'null');
    if (!sessionUser || sessionUser.role !== 'editor') {
      window.location.href = 'login.html';
    }

    document.getElementById('companyBadge').innerText = sessionUser.company_name || 'Organização';

    function logout() {
      localStorage.removeItem('geonav_session');
      window.location.href = 'login.html';
    }

    let isSidebarExpanded = false;
    function toggleSidebar() {
      isSidebarExpanded = !isSidebarExpanded;
      const sb = document.getElementById('mainSidebar');
      const icon = document.getElementById('sidebarToggleIcon');
      const texts = document.querySelectorAll('.sidebar-text');

      if (isSidebarExpanded) {
        sb.className = 'sidebar-expanded transition-all duration-300 bg-slate-900 border-r border-slate-800 flex flex-col justify-between z-40 shrink-0';
        icon.className = 'fa-solid fa-chevron-left text-xs';
        texts.forEach(t => t.classList.remove('hidden'));
      } else {
        sb.className = 'sidebar-collapsed transition-all duration-300 bg-slate-900 border-r border-slate-800 flex flex-col justify-between z-40 shrink-0';
        icon.className = 'fa-solid fa-chevron-right text-xs';
        texts.forEach(t => t.classList.add('hidden'));
      }
    }

    let map = null, markersLayer = null, routeSegmentsLayer = null, trackingLayer = null, savedFencesLayer = null, activeFenceLayer = null;
    let waypoints = [], currentFencePoints = [];
    let appMode = 'edit', totalRouteDistanceMeters = 0;

    window.addEventListener('load', () => {
      initMap();
      fetchRoutesFromDatabase();
      loadFencesData();
      setInterval(fetchActiveUsers, 5000);
    });

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-23.5505, -46.6333], 14);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

      savedFencesLayer = L.layerGroup().addTo(map);
      activeFenceLayer = L.layerGroup().addTo(map);
      routeSegmentsLayer = L.layerGroup().addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      trackingLayer = L.layerGroup().addTo(map);

      map.on('click', onMapClick);
    }

    function onMapClick(e) {
      if (appMode === 'edit') {
        waypoints.push({ lat: e.latlng.lat, lng: e.latlng.lng, speedLimit: 80, roadType: 'paved' });
        refreshRouteVisuals();
      } else if (appMode === 'fence') {
        currentFencePoints.push({ lat: e.latlng.lat, lng: e.latlng.lng });
        refreshActiveFenceVisuals();
      }
    }

    function setAppMode(mode) {
      appMode = mode;
      document.getElementById('editToolbar').classList.toggle('hidden', mode !== 'edit');
      document.getElementById('fenceToolbar').classList.toggle('hidden', mode !== 'fence');
      document.getElementById('navEditBtn').className = mode === 'edit' ? 'w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-xs transition' : 'w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-semibold text-xs transition';
      document.getElementById('navFenceBtn').className = mode === 'fence' ? 'w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl bg-rose-600 text-white font-semibold text-xs transition' : 'w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 font-semibold text-xs transition';
    }

    function refreshRouteVisuals() {
      markersLayer.clearLayers();
      routeSegmentsLayer.clearLayers();
      let totalM = 0;

      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i], p2 = waypoints[i + 1];
        totalM += distanceInMeters(p1.lat, p1.lng, p2.lat, p2.lng);
        L.polyline([[p1.lat, p1.lng], [p2.lat, p2.lng]], { color: '#4f46e5', weight: 6 }).addTo(routeSegmentsLayer);
      }

      totalRouteDistanceMeters = totalM;
      document.getElementById('routePointsCount').innerText = `${waypoints.length} pts`;
      document.getElementById('routeTotalDistance').innerText = totalM >= 1000 ? `${(totalM / 1000).toFixed(2)} km` : `${Math.round(totalM)} m`;

      waypoints.forEach((pt, i) => {
        const isStart = i === 0, isEnd = i === waypoints.length - 1 && waypoints.length > 1;
        const bg = isStart ? 'bg-emerald-500' : (isEnd ? 'bg-rose-500' : 'bg-indigo-600');
        const icon = L.divIcon({ html: `<div class="custom-marker-pin ${bg}" style="width:26px;height:26px;font-size:11px;">${i + 1}</div>`, className: '', iconSize: [26, 26], iconAnchor: [13, 13] });
        
        // dragend para manter movimento suave e sem travamentos
        L.marker([pt.lat, pt.lng], { icon, draggable: true }).on('dragend', (e) => {
          pt.lat = e.target.getLatLng().lat;
          pt.lng = e.target.getLatLng().lng;
          refreshRouteVisuals();
        }).addTo(markersLayer);
      });
    }

    function distanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function undoLastWaypoint() { waypoints.pop(); refreshRouteVisuals(); }
    function clearCurrentRoute() { waypoints = []; refreshRouteVisuals(); }
    function fitRouteBounds() { if (waypoints.length > 0) map.fitBounds(L.latLngBounds(waypoints.map(p => [p.lat, p.lng])), { padding: [50, 50] }); }
    function findMyCurrentLocation() { navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude, p.coords.longitude], 16)); }

    // API MULTI-TENANT (POR EMPRESA)
    function openSaveModal() { if (waypoints.length >= 2) document.getElementById('saveModal').classList.remove('hidden'); }
    function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }

    async function confirmSaveRoute() {
      const name = document.getElementById('routeNameInput').value.trim() || 'Nova Rota';
      const btn = document.getElementById('saveModal').querySelector('button.bg-emerald-600');
      btn.disabled = true;
      btn.innerText = 'A guardar...';

      try {
        const res = await fetch(`${API_BASE_URL}/routes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            company_id: sessionUser.company_id, 
            name, 
            distance_meters: totalRouteDistanceMeters, 
            waypoints 
          })
        });
        
        if (!res.ok) {
          const err = await res.json();
          alert('Erro ao gravar: ' + (err.erro || 'Falha na comunicação'));
          return;
        }

        closeSaveModal();
        waypoints = [];
        refreshRouteVisuals();
        await fetchRoutesFromDatabase();
        alert(`Rota "${name}" guardada com sucesso!`);
      } catch (e) {
        alert('Erro de conexão ao salvar rota.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Guardar';
      }
    }

    async function fetchRoutesFromDatabase() {
      try {
        const res = await fetch(`${API_BASE_URL}/routes?company_id=${sessionUser.company_id}`);
        const data = await res.json();
        const c = document.getElementById('savedRoutesContainer');
        c.innerHTML = data.map(item => `
          <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between">
            <div>
              <p class="font-bold text-white text-xs">${item.name}</p>
              <p class="text-[10px] text-slate-400">${(item.distance_meters / 1000).toFixed(2)} km</p>
            </div>
            <div class="flex gap-1">
              <button onclick='loadRoute(${JSON.stringify(item.waypoints)})' class="w-7 h-7 bg-indigo-600/30 text-indigo-300 rounded-lg flex items-center justify-center"><i class="fa-solid fa-download text-xs"></i></button>
              <button onclick="deleteRoute('${item.id}')" class="w-7 h-7 bg-rose-500/20 text-rose-300 rounded-lg flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    function loadRoute(pts) { waypoints = pts; refreshRouteVisuals(); fitRouteBounds(); toggleRouteManagerModal(); }
    async function deleteRoute(id) { if (confirm('Eliminar rota?')) { await fetch(`${API_BASE_URL}/routes/${id}`, { method: 'DELETE' }); fetchRoutesFromDatabase(); } }
    function toggleRouteManagerModal() { document.getElementById('routeManagerModal').classList.toggle('hidden'); }

    // Cercas
    function refreshActiveFenceVisuals() {
      activeFenceLayer.clearLayers();
      document.getElementById('fencePointsCount').innerText = `${currentFencePoints.length} vértices`;
      if (currentFencePoints.length >= 3) L.polygon(currentFencePoints.map(p => [p.lat, p.lng]), { color: '#ef4444', fillOpacity: 0.3 }).addTo(activeFenceLayer);
    }
    function clearCurrentFenceDraft() { currentFencePoints = []; refreshActiveFenceVisuals(); }
    function openSaveFenceModal() { if (currentFencePoints.length >= 3) document.getElementById('saveFenceModal').classList.remove('hidden'); }
    function closeSaveFenceModal() { document.getElementById('saveFenceModal').classList.add('hidden'); }

    async function confirmSaveFence() {
      const name = document.getElementById('fenceNameInput').value.trim() || 'Cerca';
      const speed = parseInt(document.getElementById('fenceSpeedInput').value, 10) || 30;
      await fetch(`${API_BASE_URL}/fences`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ company_id: sessionUser.company_id, name, speed_limit_kmh: speed, points: currentFencePoints })
      });
      closeSaveFenceModal();
      clearCurrentFenceDraft();
      loadFencesData();
    }

    async function loadFencesData() {
      const res = await fetch(`${API_BASE_URL}/fences?company_id=${sessionUser.company_id}`);
      if (!res.ok) return;
      const fences = await res.json();
      savedFencesLayer.clearLayers();
      fences.forEach(f => L.polygon(f.points.map(p => [p.lat, p.lng]), { color: '#ef4444', fillOpacity: 0.25 }).addTo(savedFencesLayer));
    }

    // Telemetria isolada da Empresa
    function toggleTrackingModal() {
      const m = document.getElementById('trackingModal');
      m.classList.toggle('hidden');
      if (!m.classList.contains('hidden')) fetchActiveUsers();
    }

    async function fetchActiveUsers() {
      try {
        const res = await fetch(`${API_BASE_URL}/telemetry/active?company_id=${sessionUser.company_id}`);
        if (!res.ok) return;
        const users = await res.json();
        trackingLayer.clearLayers();
        users.forEach(u => {
          const isOnline = u.seconds_ago < 60;
          const html = `
            <div class="flex flex-col items-center">
              <span class="px-2 py-0.5 rounded-full ${isOnline ? 'bg-emerald-600' : 'bg-slate-700'} text-white text-[9px] font-black border border-white">
                ${u.name.split(' ')[0]} (${u.speed_kmh} km/h)
              </span>
              <div class="w-8 h-8 rounded-full ${isOnline ? 'bg-amber-500' : 'bg-slate-600'} text-slate-950 flex items-center justify-center text-xs font-bold shadow-lg border-2 border-white mt-0.5">
                <i class="fa-solid fa-truck"></i>
              </div>
            </div>
          `;
          L.marker([u.latitude, u.longitude], { icon: L.divIcon({ html, iconSize: [90, 50], iconAnchor: [45, 50] }) })
            .bindPopup(`<b>${u.name}</b><br>Velocidade: ${u.speed_kmh} km/h<br>Sinal: há ${Math.round(u.seconds_ago)}s`)
            .addTo(trackingLayer);
        });

        const c = document.getElementById('connectedUsersContainer');
        if (!users.length) { c.innerHTML = '<p class="text-slate-500 text-center py-4">Nenhum veículo ativo nesta organização.</p>'; return; }
        c.innerHTML = users.map(u => `
          <div class="p-2.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between">
            <div>
              <p class="font-bold text-white text-xs">${u.name}</p>
              <p class="text-[10px] text-slate-400">${u.speed_kmh} km/h • há ${Math.round(u.seconds_ago)}s</p>
            </div>
            <button onclick="map.setView([${u.latitude}, ${u.longitude}], 16); toggleTrackingModal();" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold text-[10px]">
              Focar
            </button>
          </div>
        `).join('');
      } catch (e) {}
    }
  </script>
</body>
</html>
